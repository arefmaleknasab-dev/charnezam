<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>چهارنظام دوبعدی پارامتریک K12</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1efe9;
      --panel: #fffdf8;
      --ink: #1b2430;
      --muted: #5b6673;
      --line: #d8d3c6;
      --steel: #cfd6dd;
      --accent: #c2410c;
      --dim: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Vazirmatn", system-ui, sans-serif;
      line-height: 1.7;
    }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 1.25rem 1rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
    .eyebrow { margin: 0; font-family: "Geist Mono", ui-monospace, monospace; font-size: .75rem; letter-spacing: .12em; color: var(--accent); direction: ltr; text-align: right; }
    h1 { margin: .1rem 0 .25rem; font-size: 1.5rem; line-height: 1.4; text-wrap: balance; }
    .lead { margin: 0; color: var(--muted); font-size: .95rem; text-wrap: pretty; }
    h2 { margin: 0 0 .6rem; font-size: 1rem; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }

    .model-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-bottom: .8rem; }
    .model-row label { font-weight: 500; }
    select {
      font: inherit; font-family: "Geist Mono", ui-monospace, monospace; direction: ltr;
      padding: .4rem .6rem; border: 1px solid var(--ink); border-radius: 6px; background: var(--panel); color: var(--ink);
    }
    dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .4rem .8rem; }
    dl div { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; border-bottom: 1px dashed var(--line); padding-bottom: .25rem; }
    dt { color: var(--muted); font-size: .85rem; }
    dd { margin: 0; font-family: "Geist Mono", ui-monospace, monospace; font-weight: 600; }
    .sym { font-family: "Geist Mono", ui-monospace, monospace; color: var(--dim); font-weight: 600; }

    .views { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; direction: ltr; }
    .view { margin: 0; padding: .75rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; align-items: center; max-width: 100%; }
    .view figcaption { direction: rtl; font-size: .85rem; color: var(--muted); margin-top: .4rem; }
    .view svg { display: block; height: 520px; max-width: 100%; direction: ltr; font-family: "Geist Mono", ui-monospace, monospace; }
    @media (max-width: 560px) {
      .view.front { width: 100%; }
      .view.front svg { width: 100%; height: auto; }
    }

    svg .ln, svg .thin, svg .hid, svg .ctr, svg .dim, svg .grip { vector-effect: non-scaling-stroke; }
    svg .ln { stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
    svg .thin { stroke: var(--ink); stroke-width: .8; }
    svg .hid { stroke: var(--muted); stroke-width: .9; stroke-dasharray: 5 4; }
    svg .ctr { stroke: var(--muted); stroke-width: .8; stroke-dasharray: 14 4 2 4; fill: none; }
    svg .cham { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; pointer-events: none; }
    svg .dim { stroke: var(--dim); stroke-width: .8; fill: none; }
    svg .dimfill { fill: var(--dim); }
    svg .dt { fill: var(--dim); paint-order: stroke; stroke: var(--panel); stroke-linejoin: round; }
    svg .dt.accent { fill: var(--accent); }
    svg .grip { stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
    svg .nofill { fill: none; }
    svg .hid.np { pointer-events: none; }
    svg .slotin { fill: #7d8996; }
    svg .pin { fill: #e4e8ec; }
    svg .body { fill: var(--steel); }
    svg .hatch { fill: url(#hatch); }
    svg .void { fill: var(--panel); }
    svg .slot { fill: #b4bec8; }
    svg .scroll { fill: #94a0ad; }
    svg .jaw, svg .badge { cursor: pointer; }
    svg .jaw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    svg .badge circle { fill: var(--panel); }
    svg .badge text { fill: var(--ink); font-weight: 600; }
    svg .badge.sel circle { fill: var(--accent); }
    svg .badge.sel text { fill: #fff; }

    .controls { display: flex; flex-direction: column; gap: 1.1rem; }
    .seg { display: flex; flex-wrap: wrap; gap: .4rem; }
    button {
      font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--ink);
      border-radius: 6px; padding: .35rem .8rem; cursor: pointer;
    }
    button:hover { background: #f1ece0; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
    .hint { margin: .4rem 0 0; font-size: .85rem; color: var(--muted); }

    .row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) 5.2rem; align-items: center; gap: .6rem; }
    .row label { font-size: .9rem; }
    .row output { font-family: "Geist Mono", ui-monospace, monospace; font-size: .85rem; text-align: right; }
    input[type="range"] { width: 100%; accent-color: var(--accent); direction: ltr; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; align-items: center; }
    .switch { display: inline-flex; align-items: center; gap: .5rem; }
    .switch .track { width: 2.2rem; height: 1.2rem; border-radius: 999px; background: var(--line); position: relative; flex: none; }
    .switch .track::after { content: ""; position: absolute; top: 2px; right: 2px; width: calc(1.2rem - 4px); height: calc(1.2rem - 4px); border-radius: 50%; background: var(--panel); border: 1px solid var(--ink); transition: transform .15s; }
    .switch[aria-checked="true"] .track { background: var(--accent); }
    .switch[aria-checked="true"] .track::after { transform: translateX(-1rem); }
    .switch b { font-weight: 700; }

    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .75rem; }
    .step { border: 1px solid var(--line); border-radius: 8px; padding: .7rem .8rem; display: flex; flex-direction: column; gap: .35rem; }
    .step h3 { margin: 0 0 .2rem; font-size: .95rem; }
    .step h3 span { font-weight: 400; color: var(--muted); font-size: .8rem; margin-inline-start: .3rem; }

    .readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .6rem; margin: 0; }
    .readouts div { display: block; border: 0; border-inline-start: 3px solid var(--accent); padding: .1rem .7rem; }
    .readouts dd { font-size: 1.05rem; }
    .footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; border-top: 1px solid var(--line); padding-top: .9rem; }
    .check { display: inline-flex; align-items: center; gap: .45rem; font-size: .9rem; }
    .check input { accent-color: var(--accent); width: 1rem; height: 1rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">K12 SERIES · 4-JAW CHUCK</p>
      <h1>چهارنظام دوبعدی پارامتریک</h1>
      <p class="lead">مدل را از جدول مشخصات انتخاب کنید، فک‌ها را باز و بسته یا معکوس کنید و اندازهٔ هر پلهٔ فک را جداگانه تغییر دهید.</p>
    </header>

    <section class="card" aria-labelledby="specTitle">
      <div class="model-row">
        <h2 id="specTitle" style="margin:0">مشخصات مدل</h2>
        <label for="model" class="sr">مدل:</label>
        <select id="model"></select>
      </div>
      <dl id="specs"></dl>
    </section>

    <section class="views" aria-label="نقشه‌های چهارنظام">
      <figure class="view front">
        <svg id="front" role="img" aria-label="نمای روبه‌روی چهارنظام با چهار فک"></svg>
        <figcaption>نمای روبه‌رو — برای انتخاب، روی هر فک کلیک کنید</figcaption>
      </figure>
      <figure class="view side">
        <svg id="side" role="img" aria-label="برش جانبی چهارنظام با اندازه‌ها"></svg>
        <figcaption>برش جانبی (فک ۱ و ۳)</figcaption>
      </figure>
      <figure class="view outside">
        <svg id="outside" role="img" aria-label="نمای جانبی بیرونی چهارنظام با پیچ باز و بسته کردن فک"></svg>
        <figcaption>نمای جانبی — پیچ باز و بسته کردن فک با حرکت فک‌ها می‌چرخد</figcaption>
      </figure>
    </section>

    <section class="card controls" aria-label="تنظیمات فک‌ها">
      <div>
        <h2>انتخاب فک</h2>
        <div class="seg" id="targets" role="group" aria-label="انتخاب فک برای ویرایش">
          <button type="button" data-t="all" aria-pressed="true">همهٔ فک‌ها</button>
          <button type="button" data-t="0" aria-pressed="false">فک ۱</button>
          <button type="button" data-t="1" aria-pressed="false">فک ۲</button>
          <button type="button" data-t="2" aria-pressed="false">فک ۳</button>
          <button type="button" data-t="3" aria-pressed="false">فک ۴</button>
        </div>
        <p class="hint" id="targetHint" aria-live="polite"></p>
      </div>

      <div>
        <h2>باز و بسته کردن و معکوس کردن</h2>
        <div class="row">
          <label for="pos">فاصلهٔ فک تا مرکز</label>
          <input type="range" id="pos" step="0.1">
          <output id="posOut" for="pos" dir="ltr"></output>
        </div>
        <div class="actions">
          <button type="button" id="btnClose">بستن فک</button>
          <button type="button" id="btnOpen">باز کردن فک</button>
          <button type="button" id="rev" class="switch" role="switch" aria-checked="false">
            <span class="track" aria-hidden="true"></span>
            <span>جهت فک: <b id="revState">عادی</b></span>
          </button>
        </div>
      </div>

      <div>
        <h2>اندازهٔ پله‌های فک</h2>
        <div class="steps" id="steps"></div>
      </div>

      <dl class="readouts" aria-live="polite">
        <div><dt>قطر دهانهٔ گیرش</dt><dd id="rdGrip" dir="ltr"></dd></div>
        <div><dt>طول کل فک</dt><dd id="rdLen" dir="ltr"></dd></div>
        <div><dt>ارتفاع کل فعلی (H)</dt><dd id="rdH" dir="ltr"></dd></div>
      </dl>

      <div class="footer">
        <label class="check"><input type="checkbox" id="dims" checked> نمایش اندازه‌ها روی نقشه</label>
        <button type="button" id="reset">بازنشانی فک‌ها</button>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
